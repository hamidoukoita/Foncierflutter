name: flutter_mobile_prospect_agent
description: Foncier+ mobile — prospect (acquéreur) & agent promoteur
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  dio: ^5.7.0
  go_router: ^14.6.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  intl: ^0.20.3
  google_fonts: ^6.2.1
  equatable: ^3.0.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.3
  cached_network_image: ^3.4.1
  jwt_decoder: ^2.0.1
  flutter_svg: ^2.3.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_local_notifications: ^22.3.2
  phone_numbers_parser: ^9.0.26
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

# Icône de l'appli : `dart run flutter_launcher_icons` après tout changement d'image.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icone/icone_app.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icone/icone_app_premier_plan.png"

flutter:
  uses-material-design: true
  assets:
   - assets/images/
